[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-x-vision"
version = "0.1.0"
description = "Service vision Sentinel-X : détection de mouvement sur le flux de l'ESP32-CAM, captures, flux annoté"
requires-python = ">=3.12"
dependencies = [
  "opencv-python-headless~=4.10",
  "numpy~=2.1",
  "httpx~=0.28",
  "paho-mqtt~=2.1",
  "pydantic-settings~=2.6",
]

[project.optional-dependencies]
dev = ["pytest~=8.3"]

[tool.setuptools.packages.find]
include = ["vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
