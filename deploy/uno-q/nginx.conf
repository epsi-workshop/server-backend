# Site Sentinel sur l'UNO Q : http://talos.local
#   /            page de présentation (presentation.html)
#   /dashboard/  tableau de bord (index.html, HashRouter)
#   /api, /ws    backend FastAPI (127.0.0.1:8080)
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  root /var/www/sentinel;
  server_tokens off;
  client_max_body_size 10m;  # photos des membres (reconnaissance faciale)

  location = / {
    add_header Cache-Control "no-cache" always;
    try_files /presentation.html =404;
  }
  location = /dashboard {
    return 301 /dashboard/;
  }
  location = /dashboard/ {
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
  # Application installable (tableau de bord) : service worker et manifeste relus à chaque visite.
  # Le navigateur n'active le service worker et l'invite d'installation qu'en HTTPS (ou localhost).
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }
  location /icons/ {
    add_header Cache-Control "public, max-age=604800" always;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Flux MJPEG de la caméra : envoyé image par image, sans mise en tampon.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /ws/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
  }
}
