# Carte sans écran : pas de « seat » actif, et WirePlumber désactive alors le Bluetooth audio.
# On le force pour que l'enceinte apparaisse comme sortie PipeWire de l'utilisateur arduino.
# À copier dans ~/.config/wireplumber/wireplumber.conf.d/ (fait par fix-bluetooth-audio.sh).
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
