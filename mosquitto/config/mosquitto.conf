# Mosquitto de production (cahier des charges, 8.3) : MQTTS uniquement, certificat client obligatoire.
# Le CN du certificat devient l'identifiant MQTT (use_identity_as_username), contrôlé par l'ACL.
per_listener_settings false
allow_anonymous false
acl_file /mosquitto/config/acl

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key
# Version minimale acceptée (TLS 1.2 et 1.3).
tls_version tlsv1.2
require_certificate true
use_identity_as_username true

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
