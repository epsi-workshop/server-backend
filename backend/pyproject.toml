[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-x-backend"
version = "0.1.0"
description = "Backend Sentinel-X : API REST, WebSocket temps réel, authentification et audit"
requires-python = ">=3.12"
dependencies = [
  "fastapi~=0.115",
  "uvicorn[standard]~=0.32",
  "sqlalchemy[asyncio]~=2.0",
  "asyncpg~=0.30",
  "argon2-cffi~=23.1",
  "pydantic-settings~=2.6",
  "paho-mqtt~=2.1",
  "psutil~=6.1",
  "httpx~=0.28",
  "websockets>=13",  # client WebSocket de l'API capteurs (websockets.asyncio)
  "opencv-python-headless~=4.10",  # reconnaissance faciale : enrôlement des membres (faces.py)
  "numpy~=2.1",
  "tzdata",  # fuseaux horaires pour zoneinfo (absents sous Windows et dans l'image slim)
]

[project.optional-dependencies]
dev = ["pytest~=8.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
