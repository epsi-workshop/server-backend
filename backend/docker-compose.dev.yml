# Base de données et broker MQTT pour développer en local : backend et vision tournent sur l'hôte.
# Identifiants de développement uniquement, ports liés à 127.0.0.1.
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      retries: 10

  # Sans TLS ni authentification : uniquement pour le développement, en attendant la PKI (#11) et
  # la configuration de production (#12 : port 8883, certificat client obligatoire, ACL).
  # Si un Mosquitto est déjà installé sur le poste (service Windows sur 127.0.0.1:1883), l'utiliser
  # à la place : docker compose -f docker-compose.dev.yml up -d db
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto-dev.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  dbdata:
